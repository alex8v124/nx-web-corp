<section id="contacto" class="contact-section">
  <div class="container">
    <div class="contact-wrapper glass-panel">
      <div class="contact-info">
        <h2 class="section-title">Hablemos de tu Proyecto</h2>
        <p class="contact-desc">Déjanos tus datos y un consultor experto se comunicará contigo a la brevedad.</p>
        
        <div class="contact-details">
          <div class="detail-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
            <span>+51 919 620 888</span>
          </div>
          <div class="detail-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            <span>contacto@consultcorp.com</span>
          </div>
          <div class="detail-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            <span>Lima, Perú</span>
          </div>
        </div>
      </div>
      
      <form class="contact-form" (submit)="onSubmit($event)">
        <div class="form-group">
          <label for="name">Nombre Completo</label>
          <input type="text" id="name" class="form-control" placeholder="Ej. Juan Pérez" required>
        </div>
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" class="form-control" placeholder="juan@empresa.com" required>
        </div>
        <div class="form-group">
          <label for="message">Mensaje</label>
          <textarea id="message" class="form-control" rows="4" placeholder="¿Cómo podemos ayudarte?" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary form-submit">Enviar Mensaje</button>
      </form>
    </div>
  </div>
</section>
